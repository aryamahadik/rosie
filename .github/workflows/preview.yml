# Preview per task branch (build prompt 5.3; factory spec sections 6 and 7).
# Runs on push to task/**, after ci.yml's checks pass: ci.yml's `preview` job (needs: checks) calls this
# workflow inside the same run, so the commit and branch are the pushed ones.
# deploy:preview migrates the preview_<slug> schema (when STAGING_DATABASE_URL is set) and uploads a Worker
# version with a preview alias; the preview URL goes in the job summary.
# Without the Cloudflare secrets it skips with a notice, so the run stays green.
name: preview

on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false
      STAGING_DATABASE_URL:
        required: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: deploy preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: preview-${{ github.ref_name }}
      cancel-in-progress: true
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Check secrets
        id: secrets
        env:
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL != '' }}
        run: |
          set -euo pipefail
          missing=()
          [ "$HAS_CLOUDFLARE_API_TOKEN" = "true" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ "$HAS_CLOUDFLARE_ACCOUNT_ID" = "true" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Preview skipped::The repository secret(s) ${missing[*]} are not set, so no preview was deployed for $BRANCH."
          fi
          if [ "$HAS_STAGING_DATABASE_URL" = "true" ]; then
            echo "database=true" >> "$GITHUB_OUTPUT"
          else
            echo "database=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No preview schema::STAGING_DATABASE_URL is not set, so deploy:preview skips the preview_<slug> migrations."
          fi

      - name: Check out
        if: steps.secrets.outputs.cloudflare == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node (no dependency cache in a job that holds secrets)
        if: steps.secrets.outputs.cloudflare == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install from the lockfile
        if: steps.secrets.outputs.cloudflare == 'true'
        run: npm ci --no-audit --no-fund

      - name: Deploy the preview
        id: deploy
        if: steps.secrets.outputs.cloudflare == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          npm run deploy:preview -- "$BRANCH" 2>&1 | tee "$RUNNER_TEMP/deploy-preview.log"

      - name: Job summary
        if: always()
        env:
          CLOUDFLARE_READY: ${{ steps.secrets.outputs.cloudflare }}
          DATABASE_READY: ${{ steps.secrets.outputs.database }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          URL_FROM_SCRIPT: ${{ steps.deploy.outputs.preview_url }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/deploy-preview.log"
          url="$URL_FROM_SCRIPT"
          if [ -z "$url" ] && [ -f "$log" ]; then
            # wrangler prints "Version Preview Alias URL: https://<alias>-<worker>.<subdomain>.workers.dev".
            clean="$(sed 's/\x1b\[[0-9;]*m//g' "$log")"
            url="$(printf '%s\n' "$clean" | grep -Ei 'alias url' | grep -Eo 'https://[^[:space:]]+' | tail -n 1 || true)"
            if [ -z "$url" ]; then
              url="$(printf '%s\n' "$clean" | grep -Eo 'https://[^[:space:]]+\.workers\.dev[^[:space:]]*' | tail -n 1 || true)"
            fi
          fi
          {
            echo "## Preview: $BRANCH"
            echo ""
            echo "- Commit: \`$GITHUB_SHA\`"
            if [ "$CLOUDFLARE_READY" != "true" ]; then
              echo "- Skipped: the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are needed."
            elif [ "$DEPLOY_OUTCOME" = "success" ]; then
              echo "- Preview URL: ${url:-not found in the deploy log}"
            else
              echo "- The preview deploy did not succeed (outcome: ${DEPLOY_OUTCOME:-not run}); see the job log."
            fi
            if [ "$DATABASE_READY" != "true" ]; then
              echo "- Database: no preview schema (STAGING_DATABASE_URL is not set)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
