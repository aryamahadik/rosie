# Every branch: format, lint, type check, tests, the test guard and the migration guard
# (build prompt 5.2; factory spec sections 3 and 7). Needs no secret, so it goes green without any.
name: ci

on:
  # A task branch runs once, through its pull request; main runs after each merge (DL-065, lever 1).
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  # Keep every run on main; on other branches a newer push replaces the running one.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out (full history, so the guards can compare with origin/main)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Contract types (generated into contracts/generated/, git-ignored, never committed)
        run: npm run contracts:types

      - name: Contract fixtures (each against its schema; no-op until the contracts workspace has the script)
        run: npm run contracts:check

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests (unit, workers, contract)
        run: npm test

      # T-1067: the parity shards (every compiler/src/**/parity.shard-*.test.ts; T-1076: any compiler/src change runs them) are the "parity" Vitest project, outside
      # `npm test`. They run only when a parity input changed: compared with origin/main on a pull request, with
      # the previous commit on a push to main. merge-check.yml holds the same list.
      - name: Parity inputs changed (compiler, master fixtures, Vitest config, manifest, lockfile)
        id: parity
        run: |
          set -euo pipefail
          inputs=(compiler/src fixtures/master vitest.config.ts package.json package-lock.json)
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            changed="$(git diff --name-only HEAD^ HEAD -- "${inputs[@]}")"
          else
            changed="$(git diff --name-only origin/main...HEAD -- "${inputs[@]}")"
          fi
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Parity inputs changed, so the parity shards run:"
            echo "$changed"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No parity input changed: the parity shards are skipped."
          fi

      - name: Parity shards (only when its inputs changed)
        if: steps.parity.outputs.run == 'true'
        run: npm run test:parity

      - name: CI script tests (the guards and the PreToolUse hook)
        run: node --test "infra/ci/*.test.mjs"

      - name: Test guard (no fewer tests, no new skip, todo or only)
        run: npm run guard:tests

      - name: Migration guard (migrations only expand)
        run: npm run guard:migrations

      - name: Frozen-contract guard (no edit to a schema or fixture of a frozen version)
        run: npm run guard:contracts
