# The merge queue's check (build prompt 5.2 and 6.5; factory spec section 7). Before merging, the lead runs:
#   gh workflow run merge-check.yml -f branch=task/T-xxx [-f ai_change=true]
# It rebases the branch onto origin/main inside the runner (a conflict fails the run: the lead hands it back as
# a rebase step), runs everything ci.yml runs, then applies the migrations to a PostGIS service container and
# runs the integration, scenario and end-to-end tests. Nothing is pushed. Needs no secret.
name: merge-check

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to check, for example task/T-041"
        required: true
        type: string
      ai_change:
        description: "The branch changes what the AI does: also run the eval smoke slice"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: merge-check-${{ inputs.branch }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  merge-check:
    name: merge check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: rosie
          POSTGRES_PASSWORD: rosie
          POSTGRES_DB: rosie
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rosie -d rosie"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      BRANCH: ${{ inputs.branch }}
      # The throwaway CI database (factory spec section 4: rosie/rosie is local only, not a secret).
      DATABASE_URL: postgres://rosie:rosie@localhost:5432/rosie
    steps:
      - name: Check the branch name
        run: |
          set -euo pipefail
          if ! [[ "$BRANCH" =~ ^(task|train)/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] || [[ "$BRANCH" == *..* ]]; then
            echo "::error title=Bad branch::branch must be a task/... or train/... branch, not \"$BRANCH\"."
            exit 1
          fi

      - name: Check out the branch (full history)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase onto origin/main (a conflict fails the run)
        run: |
          set -euo pipefail
          git config user.name "rosie merge-check"
          git config user.email "merge-check@users.noreply.github.com"
          before="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error title=Rebase conflict::$BRANCH does not rebase cleanly onto origin/main ($main). It goes back to its owner as a rebase step."
            exit 1
          fi
          after="$(git rev-parse HEAD)"
          echo "Rebased $BRANCH ($before) onto origin/main ($main): now $after"
          {
            echo "## merge-check: $BRANCH"
            echo ""
            echo "- Branch head: \`$before\`"
            echo "- origin/main: \`$main\`"
            echo "- Checked (rebased, not pushed): \`$after\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Contract types (generated into contracts/generated/, git-ignored, never committed)
        run: npm run contracts:types

      - name: Contract fixtures (each against its schema; no-op until the contracts workspace has the script)
        run: npm run contracts:check

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Tests (unit, workers, contract)
        run: npm test

      # The parity shards run in the parity-shard jobs below (T-1078), not here.
      - name: CI script tests (the guards and the PreToolUse hook)
        run: node --test "infra/ci/*.test.mjs"

      - name: Test guard (no fewer tests, no new skip, todo or only)
        run: npm run guard:tests

      - name: Migration guard (migrations only expand)
        run: npm run guard:migrations

      - name: Frozen-contract guard (no edit to a schema or fixture of a frozen version)
        run: npm run guard:contracts

      - name: Apply the migrations to the CI database
        run: npm run migrate

      - name: Migration runner tests (against the service database, throwaway schemas)
        run: npm run test:scripts

      - name: Integration tests
        run: npm run test:integration

      - name: Scenario tests
        run: npm run test:scenario

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Eval smoke slice (AI changes only)
        if: inputs.ai_change
        run: echo "no gold set yet"

      - name: Job summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          AI_CHANGE: ${{ inputs.ai_change }}
        run: |
          set -euo pipefail
          {
            echo "- Result: $JOB_STATUS"
            if [ "$AI_CHANGE" = "true" ]; then
              echo "- Eval smoke slice: no gold set yet"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # T-1067, T-1076, T-1078: the parity shards (every compiler/src/**/parity.shard-*.test.ts) are the "parity" Vitest
  # project, outside `npm test`. They run only here, only when a parity input changed on the branch rebased onto
  # origin/main, and in parallel jobs with no database service. A failed shard job fails the run; skipped shards
  # (no parity input changed) do not. ci.yml never runs them.
  parity-inputs:
    name: parity inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BRANCH: ${{ inputs.branch }}
    outputs:
      run: ${{ steps.parity.outputs.run }}
    steps:
      - name: Check the branch name
        run: |
          set -euo pipefail
          if ! [[ "$BRANCH" =~ ^(task|train)/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] || [[ "$BRANCH" == *..* ]]; then
            echo "::error title=Bad branch::branch must be a task/... or train/... branch, not \"$BRANCH\"."
            exit 1
          fi

      - name: Check out the branch (full history)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase onto origin/main (a conflict fails the run)
        run: |
          set -euo pipefail
          git config user.name "rosie merge-check"
          git config user.email "merge-check@users.noreply.github.com"
          before="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error title=Rebase conflict::$BRANCH does not rebase cleanly onto origin/main ($main). It goes back to its owner as a rebase step."
            exit 1
          fi
          echo "Rebased $BRANCH ($before) onto origin/main ($main): now $(git rev-parse HEAD)"

      - name: Parity inputs changed (compiler, master fixtures, Vitest config, manifest, lockfile)
        id: parity
        run: |
          set -euo pipefail
          inputs=(compiler/src fixtures/master vitest.config.ts package.json package-lock.json)
          changed="$(git diff --name-only origin/main...HEAD -- "${inputs[@]}")"
          # T-1320 (DL-600): when package.json is the only input that changed, infra/ci/parity-inputs.mjs judges it,
          # as origin/main holds it (as it holds this file), never the branch's copy. It prints scripts-only when the
          # change is confined to script lines the parity run never runs (not test:parity, nor any script it or
          # npm ci runs): then package.json is not an input. Any other answer counts it, and a rule that fails
          # fails this step, so the shards are never skipped by a broken rule.
          if [ "$changed" = "package.json" ]; then
            rule="$(mktemp -d)"
            git show origin/main:infra/ci/parity-inputs.mjs > "$rule/parity-inputs.mjs"
            verdict="$(node "$rule/parity-inputs.mjs" origin/main HEAD)"
            rm -rf "$rule"
            if [ "$verdict" = "scripts-only" ]; then
              echo "package.json changed only in script lines the parity run never runs: not a parity input."
              changed=""
            fi
          fi
          if [ -n "$changed" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Parity inputs changed, so the parity shards run:"
            echo "$changed"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No parity input changed: the parity shards are skipped."
          fi

  parity-shard:
    name: parity shard ${{ matrix.shard }} of 3
    needs: parity-inputs
    if: needs.parity-inputs.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      BRANCH: ${{ inputs.branch }}
      SHARD_COUNT: 3
    steps:
      - name: Check the branch name
        run: |
          set -euo pipefail
          if ! [[ "$BRANCH" =~ ^(task|train)/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*$ ]] || [[ "$BRANCH" == *..* ]]; then
            echo "::error title=Bad branch::branch must be a task/... or train/... branch, not \"$BRANCH\"."
            exit 1
          fi

      - name: Check out the branch (full history)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Rebase onto origin/main (a conflict fails the run)
        run: |
          set -euo pipefail
          git config user.name "rosie merge-check"
          git config user.email "merge-check@users.noreply.github.com"
          before="$(git rev-parse HEAD)"
          main="$(git rev-parse origin/main)"
          if ! git rebase origin/main; then
            git rebase --abort || true
            echo "::error title=Rebase conflict::$BRANCH does not rebase cleanly onto origin/main ($main). It goes back to its owner as a rebase step."
            exit 1
          fi
          echo "Rebased $BRANCH ($before) onto origin/main ($main): now $(git rev-parse HEAD)"

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install from the lockfile
        run: npm ci --no-audit --no-fund

      - name: Parity shards (this job's share of the parity files)
        run: npm run test:parity -- --shard="${{ matrix.shard }}/$SHARD_COUNT"
