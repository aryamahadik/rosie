# Staging rollback the lead can start at any hour (build prompt 5.4; factory spec sections 6 and 7):
#   gh workflow run rollback.yml [-f version_id=<worker version id>] [-f reason="..."]
# or an automated check later: repository_dispatch with event type "rollback" and an optional client_payload
# { "version_id": "...", "reason": "..." }. It runs only rollback:staging, which goes back (to the previous
# deployment, or the version given), never forward, and leaves migrations in place.
# Without the Cloudflare secrets there is no staging to roll back, so it skips with a notice.
# The check after the rollback reads the optional repository variable STAGING_BASE_URL (not a secret).
name: rollback

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: "Worker version id to go back to (empty: the previous deployment)"
        required: false
        type: string
        default: ""
      reason:
        description: "Why (shown in the job summary)"
        required: false
        type: string
        default: ""
  repository_dispatch:
    types: [rollback]

permissions:
  contents: read

# One rollback at a time; a running one is never cancelled.
concurrency:
  group: staging-rollback
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  rollback:
    name: rollback staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION_ID: ${{ github.event.client_payload.version_id || inputs.version_id || '' }}
      ROLLBACK_REASON: ${{ github.event.client_payload.reason || inputs.reason || '' }}
      # Optional repository variable (not a secret): where check:staging looks after the rollback.
      STAGING_BASE_URL: ${{ vars.STAGING_BASE_URL }}
    steps:
      - name: Check the request and the secrets
        id: request
        env:
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error title=Not main::rollback.yml runs only from main (this run is on $GITHUB_REF)."
            exit 1
          fi
          uuid='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          if [ -n "$VERSION_ID" ] && ! [[ "$VERSION_ID" =~ $uuid ]]; then
            echo "::error title=Bad version id::version_id must be a Worker version id (a UUID)."
            exit 1
          fi
          missing=()
          [ "$HAS_CLOUDFLARE_API_TOKEN" = "true" ] || missing+=(CLOUDFLARE_API_TOKEN)
          [ "$HAS_CLOUDFLARE_ACCOUNT_ID" = "true" ] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "cloudflare=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Rollback skipped::The repository secret(s) ${missing[*]} are not set, so there is no staging deploy to roll back."
          fi
          if [ -z "$STAGING_BASE_URL" ]; then
            echo "::warning title=No STAGING_BASE_URL::The rollback still runs, but check:staging after it needs the STAGING_BASE_URL repository variable."
          fi

      - name: Check out
        if: steps.request.outputs.cloudflare == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node (no dependency cache in a job that holds secrets)
        if: steps.request.outputs.cloudflare == 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install from the lockfile
        if: steps.request.outputs.cloudflare == 'true'
        run: npm ci --no-audit --no-fund

      - name: Roll staging back (back only)
        id: rollback
        if: steps.request.outputs.cloudflare == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/rollback-staging.log"
          if [ -n "$VERSION_ID" ]; then
            npm run rollback:staging -- "$VERSION_ID" 2>&1 | tee "$log"
          else
            npm run rollback:staging 2>&1 | tee "$log"
          fi

      - name: Job summary
        if: always()
        env:
          REQUEST_OUTCOME: ${{ steps.request.outcome }}
          CLOUDFLARE_READY: ${{ steps.request.outputs.cloudflare }}
          ROLLBACK_OUTCOME: ${{ steps.rollback.outcome }}
          TRACE_FROM_SCRIPT: ${{ steps.rollback.outputs.trace_id }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/rollback-staging.log"
          trace="$TRACE_FROM_SCRIPT"
          if [ -z "$trace" ] && [ -f "$log" ]; then
            trace="$(sed 's/\x1b\[[0-9;]*m//g' "$log" | grep -Eio 'trace[ _-]?id"?[[:space:]]*[:=][[:space:]]*"?[A-Za-z0-9-]{8,}' | tail -n 1 | grep -Eo '[A-Za-z0-9-]{8,}$' || true)"
          fi
          {
            echo "## Staging rollback"
            echo ""
            echo "- Started by: $GITHUB_ACTOR ($GITHUB_EVENT_NAME)"
            echo "- Reason: ${ROLLBACK_REASON:0:300}"
            echo "- Back to: ${VERSION_ID:-the previous deployment}"
            if [ "$REQUEST_OUTCOME" != "success" ]; then
              echo "- Refused: see the error in the job log (only from main, and version_id must be a version id)."
            elif [ "$CLOUDFLARE_READY" != "true" ]; then
              echo "- Skipped: the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are needed."
            else
              echo "- Rollback: ${ROLLBACK_OUTCOME:-not run}; migrations stay in place"
              echo "- Trace id from the check after the rollback: ${trace:-none found in the log}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
